<!DOCTYPE html>
<html>
<head>
    <title>Pi Control</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        .item {
            padding: 15px;
            margin: 10px 0;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .label {
            color: #666;
        }

        button {
            padding: 12px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Raspberry Pi Control</h1>

    <div class="item">
        <span class="label">Application:</span>
        <strong id="appStatus">Checking...</strong>
    </div>

    <div class="item">
        <span class="label">Local Commit:</span>
        <strong id="localCommit">---</strong>
    </div>

    <div class="item">
        <span class="label">GitHub Commit:</span>
        <strong id="remoteCommit">---</strong>
    </div>

    <div class="item">
        <span class="label">GitHub Status:</span>
        <strong id="updateStatus">Checking...</strong>
    </div>

    <button onclick="startScript()">
        ▶ Start Script
    </button>

    <div id="message"></div>

</div>

<script>

async function checkStatus() {

    try {

        const response = await fetch("/status");
        const data = await response.json();

        document.getElementById("appStatus").innerText =
            data.running ? "Running" : "Stopped";

        document.getElementById("localCommit").innerText =
            data.local_commit;

        document.getElementById("remoteCommit").innerText =
            data.remote_commit;

        document.getElementById("updateStatus").innerText =
            data.update_available
                ? "⚠ Update Available"
                : "✓ Up to date";

    } catch (error) {

        document.getElementById("message").innerText =
            "Unable to connect to server.";

    }
}


async function startScript() {

    const response = await fetch("/start", {
        method: "POST"
    });

    const data = await response.json();

    document.getElementById("message").innerText =
        data.message;

    checkStatus();
}


checkStatus();

</script>

</body>
</html>
